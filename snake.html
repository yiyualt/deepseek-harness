<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇 · Snake</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1b2330; --grid:#16202b; --line:#22303f;
    --snake:#5ce67a; --snake-d:#2ea84d; --head:#aef7c0;
    --food:#ff5d6c; --food-glow:#ff8a96; --text:#e6edf3; --dim:#8b98a8;
    --accent:#5cc8ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2735 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    min-height:100%;padding:18px;user-select:none;
  }
  .wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  header{text-align:center}
  header h1{font-size:22px;font-weight:700;letter-spacing:1px}
  header h1 span{color:var(--snake)}
  header p{color:var(--dim);font-size:12.5px;margin-top:4px}
  .stage{
    position:relative;border-radius:16px;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 1px var(--line) inset;
    background:var(--grid);
  }
  canvas{display:block;touch-action:none}
  .hud{
    position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:10px 14px;font-variant-numeric:tabular-nums;font-size:13px;
    background:linear-gradient(to bottom, rgba(0,0,0,.35), transparent);
    pointer-events:none;
  }
  .hud .s{color:var(--text)}
  .hud .s b{color:var(--snake)}
  .hud .h b{color:var(--accent)}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;background:rgba(8,12,16,.72);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:opacity .18s ease;text-align:center;padding:16px;
  }
  .overlay.show{opacity:1;visibility:visible}
  .overlay h2{font-size:26px;letter-spacing:1px}
  .overlay p{color:var(--dim);font-size:13px;line-height:1.6}
  .overlay p b{color:var(--text)}
  .btn{
    pointer-events:auto;cursor:pointer;border:none;border-radius:10px;
    padding:10px 20px;font-size:14px;font-weight:600;color:#06150a;
    background:linear-gradient(180deg,var(--snake),var(--snake-d));
    box-shadow:0 6px 18px rgba(92,230,122,.3);transition:transform .08s ease;
  }
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
  .row{display:flex;gap:10px}
  .controls{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:8px;justify-content:center}
  .controls button{
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    border-radius:10px;font-size:18px;cursor:pointer;transition:background .12s;
  }
  .controls button:active{background:#263243}
  .controls .blank{visibility:hidden}
  footer{color:var(--dim);font-size:11.5px;text-align:center;line-height:1.7}
  footer kbd{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
    background:#11181f;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text);
  }
  @media (min-width:520px){.controls{display:none}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>贪吃蛇 <span>Snake</span></h1>
      <p>方向键 / WASD 移动 · P 暂停 · 吃到食物得分</p>
    </header>

    <div class="stage" id="stage">
      <canvas id="board" width="480" height="480"></canvas>
      <div class="hud">
        <div class="s">分数 <b id="score">0</b></div>
        <div class="h">最高 <b id="best">0</b></div>
      </div>
      <div class="overlay show" id="overlay">
        <h2 id="title">贪吃蛇</h2>
        <p id="msg">准备好了就按 <b>空格</b> 或点击下方按钮开始</p>
        <div class="row">
          <button class="btn" id="start">开始游戏</button>
        </div>
      </div>
    </div>

    <div class="controls" id="dpad">
      <span class="blank"></span><button data-dir="up">▲</button><span class="blank"></span>
      <button data-dir="left">◀</button><span class="blank"></span><button data-dir="right">▶</button>
      <span class="blank"></span><button data-dir="down">▼</button><span class="blank"></span>
    </div>

    <footer>
      <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 ·
      <kbd>P</kbd> / <kbd>空格</kbd> 暂停 · <kbd>R</kbd> 重开
    </footer>
  </div>

<script>
(() => {
  const COLS = 20, ROWS = 20, CELL = 24;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const startBtn = document.getElementById('start');

  let snake, dir, nextDir, food, score, best, state, tick, acc, last;
  best = +(localStorage.getItem('snake_best') || 0);
  bestEl.textContent = best;

  function reset(){
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; scoreEl.textContent = 0;
    placeFood();
    state = 'idle'; tick = 130; acc = 0; last = 0;
    draw();
  }

  function placeFood(){
    const cells = [];
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
      if(!snake.some(s=>s.x===x&&s.y===y)) cells.push({x,y});
    }
    food = cells[(Math.random()*cells.length)|0];
  }

  function step(){
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    // wall collision
    if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){ return gameOver(); }
    // self collision
    if(snake.some(s=>s.x===head.x&&s.y===head.y)){ return gameOver(); }
    snake.unshift(head);
    if(head.x===food.x && head.y===food.y){
      score++; scoreEl.textContent = score;
      if(score>best){ best=score; bestEl.textContent=best; localStorage.setItem('snake_best',best); }
      tick = Math.max(70, 130 - Math.floor(score/3)*5); // gradually faster
      placeFood();
    } else {
      snake.pop();
    }
  }

  function gameOver(){
    state = 'over';
    titleEl.textContent = '游戏结束';
    msgEl.innerHTML = `本局得分 <b>${score}</b>${score>=best && score>0 ? ' · 新纪录!' : ''}<br>按 <b>空格</b> 或 <b>R</b> 重新开始`;
    startBtn.textContent = '再来一局';
    overlay.classList.add('show');
  }

  function draw(){
    // background
    ctx.fillStyle = '#16202b';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // grid lines
    ctx.strokeStyle = 'rgba(255,255,255,.04)';
    ctx.lineWidth = 1;
    for(let x=0;x<=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL+.5,0); ctx.lineTo(x*CELL+.5,ROWS*CELL); ctx.stroke(); }
    for(let y=0;y<=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL+.5); ctx.lineTo(COLS*CELL,y*CELL+.5); ctx.stroke(); }

    // food
    const fx = food.x*CELL, fy = food.y*CELL;
    ctx.save();
    ctx.shadowColor = 'rgba(255,93,108,.7)'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#ff5d6c';
    ctx.beginPath();
    ctx.arc(fx+CELL/2, fy+CELL/2, CELL/2-4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(fx+CELL/2-3, fy+CELL/2-3, 2, 0, Math.PI*2); ctx.fill();

    // snake
    for(let i=snake.length-1;i>=0;i--){
      const s = snake[i], sx=s.x*CELL, sy=s.y*CELL;
      const isHead = i===0;
      const pad = isHead ? 1 : 2;
      ctx.fillStyle = isHead ? '#aef7c0' : (i%2 ? '#5ce67a' : '#49d968');
      roundRect(ctx, sx+pad, sy+pad, CELL-pad*2, CELL-pad*2, 6);
      ctx.fill();
      if(isHead){
        // eyes facing direction
        ctx.fillStyle = '#0f1419';
        const ex = sx+CELL/2, ey = sy+CELL/2;
        const off = 5, r = 2.4;
        const perp = {x:-dir.y, y:dir.x};
        const e1 = {x: ex + dir.x*off + perp.x*4, y: ey + dir.y*off + perp.y*4};
        const e2 = {x: ex + dir.x*off - perp.x*4, y: ey + dir.y*off - perp.y*4};
        ctx.beginPath(); ctx.arc(e1.x,e1.y,r,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(e2.x,e2.y,r,0,Math.PI*2); ctx.fill();
      }
    }
  }

  function roundRect(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  function loop(ts){
    if(state==='play'){
      if(!last) last = ts;
      acc += ts - last; last = ts;
      while(acc >= tick){
        acc -= tick;
        step();
        if(state!=='play') break;
      }
      draw();
    } else {
      last = 0;
    }
    requestAnimationFrame(loop);
  }

  function start(){
    if(state==='over' || state==='idle'){ reset(); }
    state = 'play'; last = 0; acc = 0;
    overlay.classList.remove('show');
  }

  function pause(){
    if(state==='play'){
      state='pause';
      titleEl.textContent='已暂停';
      msgEl.innerHTML='按 <b>空格</b> 继续';
      startBtn.textContent='继续';
      overlay.classList.add('show');
    } else if(state==='pause'){
      start();
    }
  }

  function setDir(dx,dy){
    if(state!=='play') return;
    // disallow reversing
    if(dx===-dir.x && dy===-dir.y) return;
    nextDir = {x:dx,y:dy};
  }

  // keyboard
  window.addEventListener('keydown', e=>{
    const k = e.key.toLowerCase();
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
    switch(k){
      case 'arrowup': case 'w': setDir(0,-1); break;
      case 'arrowdown': case 's': setDir(0,1); break;
      case 'arrowleft': case 'a': setDir(-1,0); break;
      case 'arrowright': case 'd': setDir(1,0); break;
      case ' ': if(state==='idle'||state==='over') start(); else pause(); break;
      case 'p': pause(); break;
      case 'r': reset(); start(); break;
    }
  });

  // dpad (mobile)
  document.getElementById('dpad').addEventListener('click', e=>{
    const b = e.target.closest('button[data-dir]'); if(!b) return;
    if(state==='idle'||state==='over'){ start(); }
    switch(b.dataset.dir){
      case 'up': setDir(0,-1); break;
      case 'down': setDir(0,1); break;
      case 'left': setDir(-1,0); break;
      case 'right': setDir(1,0); break;
    }
  });

  // swipe (mobile)
  let touchStart = null;
  canvas.addEventListener('touchstart', e=>{
    touchStart = e.touches[0]; 
    if(state==='idle'||state==='over') start();
  }, {passive:true});
  canvas.addEventListener('touchend', e=>{
    if(!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX-touchStart.clientX, dy = t.clientY-touchStart.clientY;
    if(Math.abs(dx)<18 && Math.abs(dy)<18){ return; }
    if(Math.abs(dx)>Math.abs(dy)){ setDir(dx>0?1:-1,0); } else { setDir(0,dy>0?1:-1); }
    touchStart=null;
  }, {passive:true});

  startBtn.addEventListener('click', ()=>{
    if(state==='pause') start(); else { reset(); start(); }
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
